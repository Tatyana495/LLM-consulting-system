[project]
name = "auth-service"
version = "0.1.0"
description = "Authentication service for LLM consulting system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.9.0",
    "bcrypt==4.0.1",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
